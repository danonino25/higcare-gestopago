# ==========================================
# Servidor
# ==========================================
server.port=8080
spring.cloud.config.enabled=false

# ==========================================
# Documentacion Swagger
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# Configuracion de Redis (Cache)
# ==========================================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# ==========================================
# Base de Datos PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_servicios
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# ==========================================
# Configuracion de Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

# ==========================================
# Servicio de Autenticacion GestoPago
# (usado por GestoPagoAuthClient / GestoPagoTokenServiceImpl
# para obtener y renovar el Bearer token de forma automatica)
# ==========================================
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.endpoint=/sistema/app/jwt-gp/authenticate/
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.refresh-rate-ms=3600000

# ==========================================
# Servicio Externo de Productos GestoPago
# ==========================================
gestopago.service.url=https://gestopago.portalventas.net
gestopago.service.endpoint=/sistema/service/getProductList.do
gestopago.service.id-distribuidor=83
gestopago.service.codigo-dispositivo=GPS83-TPV-17
gestopago.service.timeout.connect=5000
gestopago.service.timeout.read=30000

# Cron de sincronizacion diaria del catalogo (usado por GestoPagoScheduler)
gestopago.productos.cron=0 0 3 * * ?

# ==========================================
# Parametros OpenFeign
# (el cliente "gestoPagoClient" usa su propio Request.Options definido en
# GestoPagoClientConfig a partir de gestopago.service.timeout.*; este bloque
# por-nombre-logico solo aplica al cliente que no trae configuracion propia)
# ==========================================
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=15000
spring.cloud.openfeign.client.config.gestoPagoAuth.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoAuth.read-timeout=10000

# ==========================================
# Logging
# ==========================================
logging.level.com.proyecto.servicios=DEBUG